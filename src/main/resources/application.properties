# ============================================================
# Reclaim Backend — application.properties
# ============================================================

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Database ----------
# DataSource is configured programmatically in DataSourceConfig.java so that
# both postgresql:// (Render/Heroku) and jdbc:postgresql:// (local) URL formats
# are accepted without any manual editing of the DATABASE_URL env var.

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:reclaim-dev-secret-change-in-production-min-32-chars!!}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# ---------- AI (Anthropic Claude) ----------
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}

# ---------- CORS ----------
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ---------- File uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
upload.dir=${UPLOAD_DIR:uploads}

# ---------- Logging ----------
logging.level.com.reclaim=DEBUG
logging.level.org.springframework.security=INFO
